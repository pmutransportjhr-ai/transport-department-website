# Include inside each public Nginx server {} block.
# Keep this in the server context. These location rules prevent repository metadata,
# dotfiles, deployment docs, and server-side security examples from being served.
#
# The .well-known exception preserves ACME HTTP-01 challenge paths used by
# Certbot for the temporary staging IP certificate.
location = /security {
    return 404;
}

location ^~ /security/ {
    return 404;
}

# Deny dotfiles and hidden directories, but allow ACME challenge paths.
# This blocks /.git, nested .git directories, .env, .htaccess, and similar paths.
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
    access_log off;
    log_not_found off;
}
