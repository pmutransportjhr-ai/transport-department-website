# OPTIONAL. Include only when ngx_http_headers_more_filter_module is installed
# and loaded (for example, via the distro's headers-more dynamic module package).
# First verify with: nginx -V 2>&1
# If the module is absent, this directive will make nginx -t fail.
more_clear_headers 'Server';
