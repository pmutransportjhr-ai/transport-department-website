# Include in the site's server {} block.
# Also include this file inside any location {} that defines its own add_header
# directive, because Nginx versions without add_header_inherit=merge do not inherit
# server-level add_header directives into such a location.
#
# The existing pages contain inline scripts/event handlers and import Google Fonts.
# 'unsafe-inline' is retained for compatibility in this first rollout. Remove it
# after inline handlers/scripts are moved into reviewed external files or nonces/hashes.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" always;

# Intentionally not set here:
# - Strict-Transport-Security: must only be emitted after HTTPS works in production.
# - Access-Control-Allow-Origin: the static site has no identified cross-origin API;
#   configure exact allowed origins only on endpoints that genuinely require CORS.
# - X-XSS-Protection: obsolete legacy browser feature; CSP is the modern control.
