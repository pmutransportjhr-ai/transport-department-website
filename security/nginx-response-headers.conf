# Include in the relevant production HTTPS server {} block and staging server {} block.
# If a nested location {} defines its own add_header directives, repeat this include
# inside that location or configure tested Nginx header inheritance merging.
#
# The policy below deliberately:
# - blocks framing by non-same-origin pages;
# - disables MIME sniffing;
# - uses a modern CSP baseline (unsafe-inline retained only for legacy compatibility);
# - sets CORS to the one official portal origin for public GET/HEAD resources only;
# - emits X-XSS-Protection: 0 to disable deprecated browser XSS filters safely.
#
# Do not add Access-Control-Allow-Credentials unless an identified API genuinely
# needs cross-origin cookies and the application owner has approved that design.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "0" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" always;

# Finding 11: explicit CORS allowlist for the public portal origin.
# No wildcard and no credential sharing. Restrict methods to read-only website use.
add_header Access-Control-Allow-Origin "https://transport.jharkhand.gov.in" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type" always;
add_header Access-Control-Max-Age "3600" always;
add_header Vary "Origin" always;

# HSTS is deliberately not configured here. Include the separate production-only
# HSTS snippet only on the validated HTTPS production server, never on HTTP staging.
