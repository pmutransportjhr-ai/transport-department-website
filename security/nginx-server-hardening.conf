# Include inside the relevant Nginx server {} block.
# This snippet deliberately does NOT redirect HTTP to HTTPS and does NOT set HSTS.
# Staging is intentionally HTTP-only; see NGINX-DEPLOYMENT-GUIDE.md.

server_tokens off;
etag off;

# If this server proxies to an application, hide framework headers in the relevant
# proxy_pass location instead of adding blanket response headers:
# proxy_hide_header X-Powered-By;
# fastcgi_hide_header X-Powered-By;
