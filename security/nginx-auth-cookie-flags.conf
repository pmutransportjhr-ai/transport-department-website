# Include ONLY inside the HTTPS reverse-proxy location that handles login/session
# responses. Requires Nginx 1.19.3+ (proxy_cookie_flags).
#
# Secure: HTTPS-only cookie transport.
# HttpOnly: inaccessible to document.cookie.
# SameSite=Lax: baseline protection while retaining common top-level login redirects.
# Domain is intentionally not added: omitting it makes the cookie host-only.
# Set the intended Path and expiry/max-age in the backend session-cookie configuration.
proxy_cookie_flags ~ secure httponly samesite=lax;

# For a cross-site SSO callback that demonstrably requires cross-site cookies,
# change only that cookie to SameSite=None; Secure after the identity-provider
# flow has been tested. Do not apply SameSite=None to every cookie by default.
